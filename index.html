<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Steam BBCode 转换器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
 <div class="topbar-inner">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">
      <span class="logo-md">MD</span><span class="logo-arrow">→</span><span class="logo-steam">STEAM</span>
    </div>
    <div class="brand-text">
      <h1>Markdown → Steam BBCode 转换器</h1>
      <p>纯本地运行 · 无需服务器与网络 · 依据 Steam 官方格式规范</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="btn-help" class="btn btn-ghost" type="button">格式说明</button>
    <button id="btn-copy" class="btn btn-primary" type="button">复制 BBCode</button>
  </div>
 </div>
</header>

<main class="workspace">

  <!-- 左栏：Markdown 输入 -->
  <section class="pane pane-left">
    <div class="pane-head">
      <span class="pane-title">Markdown 输入</span>
      <label class="opt" title="将 Markdown 中的软换行（单个回车）也转换为 Steam 中的换行">
        <input type="checkbox" id="opt-breaks" checked> 保留原始换行
      </label>
      <span class="pane-meta" id="md-count">0 字符</span>
    </div>
    <textarea id="md-input" spellcheck="false" autocomplete="off" autocorrect="off"
      placeholder="在此输入或粘贴 Markdown 文本，右侧将实时显示转换结果……"></textarea>
  </section>

  <!-- 右栏：预览 / 代码 -->
  <section class="pane pane-right">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="preview" type="button" role="tab">视觉预览</button>
        <button class="tab" data-tab="code" type="button" role="tab">BBCode 代码</button>
      </div>
      <span class="pane-meta" id="bb-count">0 字符</span>
    </div>

    <div id="warnings" class="warnings hidden"></div>

    <div class="pane-body">
      <div id="tab-preview" class="tab-panel active">
        <div class="steam-preview" id="preview"></div>
      </div>
      <div id="tab-code" class="tab-panel">
        <pre id="bbcode" class="code-view"></pre>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <span>所有转换均在你的浏览器内完成，文本不会被上传。</span>
  <span>参考：<a href="https://steamcommunity.com/comment/Guide/formattinghelp" target="_blank" rel="noopener">Steam Text Formatting 官方文档</a></span>
</footer>

<!-- 格式说明弹窗（内容由 help-content.js 提供，来源为 README.md） -->
<div class="modal-mask hidden" id="help-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Markdown → Steam BBCode 格式对照</h2>
      <button class="modal-close" id="help-close" type="button" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body help-body" id="help-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="marked.min.js"></script>
<script src="converter.js"></script>
<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
